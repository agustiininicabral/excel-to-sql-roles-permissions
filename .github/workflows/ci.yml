name: Validate roles and permissions migration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: authorization_migration
      DB_USER: root
      DB_PASSWORD: root
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate multi-sheet workbook
        run: python scripts/generate_sample_workbook.py
      - name: Run automated tests
        run: pytest
      - name: Validate source rows before loading
        run: python -m roles_migration.main --dry-run --input data/source/authorization_source.xlsx
      - name: Apply MySQL 8.0 schema
        run: python scripts/apply_schema.py
      - name: Execute relational migration
        run: python -m roles_migration.main --input data/source/authorization_source.xlsx
      - name: Verify persisted records and foreign keys
        run: python scripts/verify_database.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roles-permissions-validation
          path: |
            reports/*.csv
            data/source/authorization_source.xlsx
          if-no-files-found: warn
