name: Validate roles and permissions migration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate multi-sheet workbook
        run: python scripts/generate_sample_workbook.py
      - name: Run automated tests
        run: pytest
      - name: Validate workbook and reconcile source rows
        run: python -m roles_migration.main --dry-run --input data/source/authorization_source.xlsx
        env:
          PYTHONPATH: src
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roles-permissions-validation
          path: |
            reports/*.csv
            data/source/authorization_source.xlsx
          if-no-files-found: warn
